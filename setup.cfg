[metadata]
name = pysimconnect
version = 0.3.0
author = Patrick Surry
author_email = patrick.surry@gmail.com
description = Python wrapper, CLI, and G3 instrument panel bridge for Microsoft Flight Simulator (MSFS 2020/2024) SimConnect SDK
long_description = file: README.md
long_description_content_type = text/markdown
keywords = pysimconnect, SimConnect, SimVars, ctypes, SDK, API, FS2020, MSFS, MSFS2020, MSFS2024, Microsoft Flight Simulator, G3, steam gauges, home cockpit, simpit
url = https://github.com/patricksurry/pysimconnect
project_urls =
    Documentation = https://patricksurry.github.io/pysimconnect/
    SimVar Explorer = https://patricksurry.github.io/pysimconnect/#search=
    Source = https://github.com/patricksurry/pysimconnect
    Bug Tracker = https://github.com/patricksurry/pysimconnect/issues
    G3 Instrument Panels = https://github.com/patricksurry/g3
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: End Users/Desktop
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.13
    License :: OSI Approved :: MIT License
    Operating System :: Microsoft :: Windows
    Operating System :: OS Independent
    Topic :: Games/Entertainment :: Simulation
    Topic :: Software Development :: Libraries :: Python Modules
    Environment :: Console
    Environment :: Web Environment

[options]
packages =
    simconnect
    simconnect.g3
python_requires = >=3.10
install_requires =
    typer >= 0.9
    click >= 8.1

[options.entry_points]
console_scripts =
    simconnect = simconnect.cli:app [typer]

[options.extras_require]
dev =
    pytest >= 7.0
    ruff >= 0.17
    mypy >= 2.4
    pre-commit >= 4.0
    scrapy

[options.package_data]
* = scvars.json, SimConnect.dll, config.json, index.html
