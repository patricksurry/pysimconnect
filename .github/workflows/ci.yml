name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . "ruff>=0.17" "mypy>=2.4"
      - run: ruff check
      - run: ruff format --check
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest and newest supported; live MSFS tests are skipped off Windows
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest -q
