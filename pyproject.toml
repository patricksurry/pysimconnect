[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# put the repo root on sys.path, so tests can patch names in tests.* modules however pytest is invoked
pythonpath = ["."]


[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "Python-SimConnect",        # a local, untracked checkout of another project
    "simconnect/scdefs.py",     # generated by scripts/genscdefs.py
]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade, for python >= 3.10
    "B",       # bugbear
]
# some "unused" imports are deliberate re-exports (e.g. winstubs), so never remove them automatically
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# the package's public facade re-exports names from its modules
"simconnect/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.flake8-bugbear]
# calls that return immutable values, so are fine as argument defaults
extend-immutable-calls = ["typer.Argument", "typer.Option", "simconnect.changedict.equal_or_close"]

[tool.mypy]
python_version = "3.10"
files = ["simconnect"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# generated, and imports Windows-only ctypes names with a non-Windows fallback
module = "simconnect.scdefs"
ignore_errors = true
