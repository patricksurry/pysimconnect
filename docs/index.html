<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pysimconnect — Python Wrapper & SDK Explorer for MSFS 2020 SimConnect</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #26354d;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --var-color: #60a5fa;
      --evt-color: #4ade80;
      --unit-color: #f87171;
      --code-bg: #0b1120;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }
    .brand span {
      font-size: 0.85rem;
      color: var(--muted);
    }
    nav {
      display: flex;
      gap: 0.5rem;
    }
    nav button {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
    }
    nav button:hover { color: var(--text); background: var(--panel); }
    nav button.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr; }
    }
    input[type="search"], select {
      background: var(--code-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.85rem;
      font-size: 0.95rem;
      width: 100%;
    }
    input[type="search"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .filter-pills {
      display: flex;
      gap: 0.35rem;
    }
    .pill {
      background: var(--code-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .pill.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.9rem 1.1rem;
      transition: background 0.12s;
    }
    .card:hover { background: var(--panel-hover); }
    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .item-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .kind-VARIABLES { color: var(--var-color); }
    .kind-EVENTS { color: var(--evt-color); }
    .kind-UNITS { color: var(--unit-color); }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 0.35rem;
      background: var(--code-bg);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge.settable {
      color: #fde047;
      border-color: rgba(253, 224, 71, 0.35);
    }
    .desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin: 0.35rem 0;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .snippet-btns {
      display: flex;
      gap: 0.4rem;
    }
    .copy-btn {
      background: var(--code-bg);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
      cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--accent); }
    .doc-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem 2rem;
      margin-bottom: 1.25rem;
    }
    .doc-section h2 {
      margin-top: 0;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .doc-section h3 { color: var(--text); margin-top: 1.25rem; }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      overflow-x: auto;
      font-size: 0.88rem;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--accent); background: var(--code-bg); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>✈️ pysimconnect</h1>
      <span>Python Wrapper &amp; SDK Explorer for MSFS 2020 SimConnect</span>
    </div>
    <nav>
      <button id="tab-btn-explorer" class="active" onclick="switchTab('explorer')">🧭 SDK Explorer</button>
      <button id="tab-btn-quickstart" onclick="switchTab('quickstart')">🚀 Quick Start</button>
      <button id="tab-btn-reference" onclick="switchTab('reference')">📘 API Reference</button>
      <a href="https://github.com/patricksurry/pysimconnect" target="_blank" style="padding:0.5rem 0.75rem;font-size:0.9rem;">GitHub ↗</a>
    </nav>
  </header>

  <main>
    <!-- TAB 1: SDK EXPLORER -->
    <section id="tab-explorer" class="tab-pane active">
      <div class="controls">
        <input
          type="search"
          id="search-input"
          placeholder="Hybrid search 3,200+ SimVars, Events & Units (e.g. 'indicated altitude', 'barometer', 'cyclic', 'transponder', 'fuel pressure')..."
          autocomplete="off"
        />
        <div class="filter-pills">
          <button class="pill active" data-kind="ALL" onclick="setKind('ALL')">All</button>
          <button class="pill" data-kind="VARIABLES" onclick="setKind('VARIABLES')">🧭 Variables</button>
          <button class="pill" data-kind="EVENTS" onclick="setKind('EVENTS')">⚙️ Events</button>
          <button class="pill" data-kind="UNITS" onclick="setKind('UNITS')">📐 Units</button>
        </div>
        <select id="category-select" onchange="runSearch()">
          <option value="">All Categories</option>
        </select>
        <label class="checkbox-label">
          <input type="checkbox" id="settable-only" onchange="runSearch()" />
          ✏️ Settable only
        </label>
      </div>

      <div class="stats-bar">
        <span id="results-count">Loading SDK catalog...</span>
        <span>Tip: Click any Python or CLI button on a card to copy ready-to-use code</span>
      </div>

      <div id="results-container" class="results-list"></div>
    </section>

    <!-- TAB 2: QUICK START (Rendered live from ../README.md) -->
    <section id="tab-quickstart" class="tab-pane">
      <div id="quickstart-md" class="doc-section">Loading Quick Start from <code>README.md</code>...</div>
    </section>

    <!-- TAB 3: API REFERENCE (Rendered live from ./reference.md) -->
    <section id="tab-reference" class="tab-pane">
      <div id="reference-md" class="doc-section">Loading API Reference from <code>docs/reference.md</code>...</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    let allItems = [];
    let itemById = new Map();
    let miniSearch = null;
    let currentKind = "ALL";

    async function loadCatalog() {
      const urls = [
        "../simconnect/scvars.json",
        "https://raw.githubusercontent.com/patricksurry/pysimconnect/master/simconnect/scvars.json"
      ];
      let data = null;
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            data = await resp.json();
            break;
          }
        } catch (e) {}
      }
      if (!data) {
        document.getElementById("results-count").textContent = "Failed to load scvars.json.";
        return;
      }

      const pages = new Set();
      let idCounter = 1;
      for (const kind of ["VARIABLES", "EVENTS", "UNITS"]) {
        const entries = data[kind] || {};
        for (const [key, d] of Object.entries(entries)) {
          const id = idCounter++;
          const name = kind === "UNITS" ? (d.name_std || d.name) : d.name;
          const nameClean = name.replace(/_/g, " ");
          const desc = (d.description || "").replace(/\s+/g, " ").trim();
          const page = (d.page || "").trim();
          const section = (d.section || "").trim();
          if (page) pages.add(page);
          const item = {
            id,
            kind,
            key,
            name,
            nameClean,
            desc,
            page,
            section,
            units: d.units_std || d.units || "",
            dimensions: d.dimensions || "",
            settable: Boolean(d.settable),
            indexed: Boolean(d.indexed),
          };
          allItems.push(item);
          itemById.set(id, item);
        }
      }

      miniSearch = new MiniSearch({
        fields: ["nameClean", "desc", "page", "section", "units"],
        storeFields: ["id"],
        searchOptions: {
          boost: { nameClean: 4, desc: 2, page: 1, section: 1, units: 1 },
          prefix: true,
          fuzzy: 0.2,
        },
      });
      miniSearch.addAll(allItems);

      const catSelect = document.getElementById("category-select");
      Array.from(pages).sort().forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        catSelect.appendChild(opt);
      });

      if (window.location.hash.startsWith("#search=")) {
        const q = decodeURIComponent(window.location.hash.slice("#search=".length).replace(/\+/g, " "));
        document.getElementById("search-input").value = q;
      }
      runSearch();
    }

    function setKind(k) {
      currentKind = k;
      document.querySelectorAll(".pill").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.kind === k);
      });
      runSearch();
    }

    function switchTab(tab) {
      ["explorer", "quickstart", "reference"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("active", t === tab);
        document.getElementById("tab-btn-" + t).classList.toggle("active", t === tab);
      });
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = orig; }, 1200);
    }

    function filterItem(item, catFilter, settableOnly) {
      if (currentKind !== "ALL" && item.kind !== currentKind) return false;
      if (catFilter && item.page !== catFilter) return false;
      if (settableOnly && !item.settable) return false;
      return true;
    }

    function runSearch() {
      const rawQ = document.getElementById("search-input").value.trim().replace(/_/g, " ");
      const catFilter = document.getElementById("category-select").value;
      const settableOnly = document.getElementById("settable-only").checked;

      let matches = [];
      if (!rawQ) {
        matches = allItems.filter(item => filterItem(item, catFilter, settableOnly));
      } else if (miniSearch) {
        const rawHits = miniSearch.search(rawQ, {
          filter: (result) => filterItem(itemById.get(result.id), catFilter, settableOnly),
        });
        matches = rawHits.map(r => itemById.get(r.id));
      }

      const limit = 100;
      const shown = matches.slice(0, limit);
      document.getElementById("results-count").textContent =
        `Showing ${shown.length} of ${matches.length} matching items (${allItems.length} total in SDK catalog)`;

      const container = document.getElementById("results-container");
      container.innerHTML = "";
      const symbols = { VARIABLES: "🧭", EVENTS: "⚙️", UNITS: "📐" };

      for (const item of shown) {
        const card = document.createElement("div");
        card.className = "card";

        const sampleName = item.indexed ? item.name.replace(/:index$/i, ":1") : item.name;
        const cliName = sampleName.replace(/\s+/g, "_");
        let pySnippet = "";
        let cliSnippet = "";
        if (item.kind === "VARIABLES") {
          pySnippet = `sc.get_simdatum("${sampleName}")`;
          cliSnippet = `simconnect get ${cliName}`;
        } else if (item.kind === "EVENTS") {
          pySnippet = `sc.send_event("${sampleName}")`;
          cliSnippet = `simconnect send ${cliName}`;
        } else {
          pySnippet = `units="${item.name}"`;
          cliSnippet = `--units ${cliName}`;
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="item-title kind-${item.kind}">
              <span>${symbols[item.kind]}</span>
              <span>${item.name}</span>
              ${item.settable ? '<span class="badge settable">✏️ Settable</span>' : ''}
              ${item.units ? `<span class="badge">${item.units}</span>` : ''}
              ${item.dimensions ? `<span class="badge">${item.dimensions}</span>` : ''}
            </div>
            <div class="snippet-btns">
              <button class="copy-btn" title="Copy Python snippet">Python</button>
              <button class="copy-btn" title="Copy CLI command">CLI</button>
            </div>
          </div>
          ${item.desc ? `<div class="desc">${item.desc}</div>` : ''}
          <div class="meta-row">
            <span>${[item.page, item.section].filter(Boolean).join(" › ")}</span>
            <code>${pySnippet}</code>
          </div>
        `;
        const btns = card.querySelectorAll(".copy-btn");
        btns[0].onclick = () => copyText(btns[0], pySnippet);
        btns[1].onclick = () => copyText(btns[1], cliSnippet);
        container.appendChild(card);
      }
    }

    async function loadMarkdownDocs() {
      const docs = [
        {
          el: "quickstart-md",
          urls: ["../README.md", "https://raw.githubusercontent.com/patricksurry/pysimconnect/master/README.md"]
        },
        {
          el: "reference-md",
          urls: ["./reference.md", "https://raw.githubusercontent.com/patricksurry/pysimconnect/master/docs/reference.md"]
        }
      ];
      for (const doc of docs) {
        for (const url of doc.urls) {
          try {
            const resp = await fetch(url);
            if (resp.ok) {
              const md = await resp.text();
              document.getElementById(doc.el).innerHTML = marked.parse(md);
              break;
            }
          } catch (e) {}
        }
      }
    }

    document.getElementById("search-input").addEventListener("input", runSearch);
    loadCatalog();
    loadMarkdownDocs();
  </script>
</body>
</html>
